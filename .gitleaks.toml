[extend]
useDefault = true

[[rules]]
id = "brain-auth-token"
description = "Brain Bearer auth token"
regex = '''BRAIN_AUTH(__TOKEN|_TOKEN)\s*=\s*[A-Za-z0-9_\-]{16,}'''
tags = ["secret", "brain"]

[[rules]]
id = "openai-key"
description = "OpenAI API key"
regex = '''sk-[A-Za-z0-9]{20,}'''
tags = ["secret", "openai"]

[[rules]]
id = "gemini-key"
description = "Google Gemini API key"
regex = '''AIza[0-9A-Za-z\-_]{35}'''
tags = ["secret", "gemini"]

[allowlist]
description = "Allowlist for example placeholders"
regexes = [
  '''<REPLACE_ME>''',
  '''<REPLACE_ME_64_CHAR_RANDOM>''',
  '''<REPLACE_ME_64_CHAR_HEX>''',
  '''replace-me-with-a-long-random-string''',
]
paths = [
  '''\.env\.example$''',
  '''README\.md$''',
  '''\.planning/''',
]
