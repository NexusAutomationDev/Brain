# apps/brain-support/docker-compose.yml
# Espelha o padrão de produção do apps/brain-sdr/docker-compose.yml: conecta em um
# Postgres externo do host (host.docker.internal) via extra_hosts, sem bundlar banco
# próprio — cada cliente já roda seu próprio Postgres compartilhado entre instâncias
# do mesmo Brain (ver "Modelo de Deployment por Cliente" no CLAUDE.md).
# Uso: docker compose -f apps/brain-support/docker-compose.yml up

services:
  brain-support:
    build:
      context: ../..
      dockerfile: apps/brain-support/Dockerfile
    image: brain-support:latest
    ports:
      - "${PORT:-3003}:${PORT:-3002}"
    env_file: .env
    environment:
      MIGRATIONS_FOLDER: /app/migrations
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - traefikNet

networks:
  traefikNet:
    external: true
