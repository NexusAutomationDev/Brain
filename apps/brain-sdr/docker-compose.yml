services:
  brain-sdr:
    build:
      context: ../..
      dockerfile: apps/brain-sdr/Dockerfile
    image: brain-sdr:1.6.2
    ports:
      - "3002:${PORT:-3001}"
    env_file: .env
    environment:
      MIGRATIONS_FOLDER: /app/migrations
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - traefikNet

networks:
  traefikNet:
    external: true
