# apps/brain-sdr/docker-compose.local.yml
# Variante local: roda diretamente a partir da imagem `brain-sdr:1.5` já presente
# no host (confirmada via `docker images`), sem etapa de build. O compose de
# build/produção continua sendo `apps/brain-sdr/docker-compose.yml`.
# Uso: docker compose -f apps/brain-sdr/docker-compose.local.yml up

services:
  brain-sdr:
    image: brain-sdr:1.5
    ports:
      - "3002:${PORT:-3001}"
    env_file: .env
    environment:
      MIGRATIONS_FOLDER: /app/migrations
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - traefikNet

networks:
  traefikNet:
    external: true
