# apps/brain-sdr/docker-compose.local.yml
# Variante local: roda diretamente a partir da imagem `brain-sdr:1.6.2`, sem etapa
# de build. A imagem precisa ter sido buildada/pullada antes no host (ver
# `apps/brain-sdr/docker-compose.yml` para o build). O compose de build/produção
# continua sendo `apps/brain-sdr/docker-compose.yml`.
# Uso: docker compose -f apps/brain-sdr/docker-compose.local.yml up

services:
  brain-sdr:
    image: brain-sdr:1.6.2
    ports:
      - "3002:${PORT:-3001}"
    env_file: .env
    environment:
      MIGRATIONS_FOLDER: /app/migrations
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - traefikNet

networks:
  traefikNet:
    external: true
