# .github/workflows/publish-brain-support.yml
# Builda a imagem do brain-support e publica direto em docker.io/biellil/brain-support
# a cada push de tag semver, autenticando via docker/login-action e publicando
# via docker/build-push-action (tags: versão semver + latest).
# Espelha .github/workflows/publish-brain-sdr.yml — mesmo trigger de tag (D-11 revisado:
# v*.*.* dispara AMBOS os workflows simultaneamente, comportamento aceito intencionalmente).
name: Publish brain-support

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*'

env:
  APP_NAME: brain-support
  IMAGE_NAME: brain-support

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/brain-support/Dockerfile
          tags: |
            biellil/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            biellil/${{ env.IMAGE_NAME }}:latest
          push: true
          cache-from: type=gha,scope=brain-support
          cache-to: type=gha,mode=max,scope=brain-support
