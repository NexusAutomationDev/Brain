name: ci

on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    # 06:00 UTC daily — full smoke (RESEARCH.md Open Question #4).
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.16"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest (unit only)
        run: uv run pytest -q -m "not integration" --cov=brain --cov-report=term-missing

      - name: env parity (Settings <-> .env.example)
        run: bash scripts/check-env-example.sh

      - name: compose parity (full <-> lite)
        run: bash scripts/check-compose-parity.sh

  gitleaks:
    name: gitleaks (CI layer per D-18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  docker-build:
    name: docker build (prod target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build prod image
        run: docker build --target prod -t brain:ci -f docker/Dockerfile .

      - name: Verify non-root + healthcheck
        run: |
          docker run --rm brain:ci id | grep -F 'uid=1001(brain)'
          docker image inspect brain:ci --format '{{ .Config.User }}' | grep -F 'brain'
          docker image inspect brain:ci --format '{{ .Config.Healthcheck.Test }}' | grep -F '/healthz'

  smoke-lite:
    name: smoke (lite stack)
    runs-on: ubuntu-latest
    needs: [lint-and-unit, docker-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Run lite smoke
        run: bash scripts/smoke-up.sh lite

  smoke-full:
    name: smoke (full stack, nightly only)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: [lint-and-unit, docker-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Run full smoke
        run: bash scripts/smoke-up.sh full

  integration-tests:
    name: integration tests (testcontainers)
    runs-on: ubuntu-latest
    needs: [lint-and-unit]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.16"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync --frozen

      - name: Run integration tests
        run: uv run pytest -q -m integration
