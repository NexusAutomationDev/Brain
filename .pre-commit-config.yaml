# .pre-commit-config.yaml
# IMPORTANT: this file is amended by plans 01-04 (grep bans).
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: ["protect", "--staged", "--config", ".gitleaks.toml"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: ["check", "--fix"]
      - id: ruff-format

  # Local grep ban hooks (plan 01-04):
  - repo: local
    hooks:
      - id: ban-asyncpg
        name: Ban asyncpg imports (FOUND-06)
        entry: scripts/lint/ban-asyncpg.sh
        language: system
        types: [python]
        pass_filenames: true

      - id: ban-sync-postgressaver
        name: Ban sync PostgresSaver outside scripts/ (D-17)
        entry: scripts/lint/ban-sync-postgressaver.sh
        language: system
        types: [python]
        pass_filenames: true

      - id: ban-raw-thread-id
        name: Ban raw f-string thread_id construction outside helper (FOUND-08)
        entry: scripts/lint/ban-raw-thread-id.sh
        language: system
        types: [python]
        pass_filenames: true

      - id: ban-stdlib-logging
        name: Ban stdlib logging in src/brain/ (FOUND-10)
        entry: scripts/lint/ban-stdlib-logging.sh
        language: system
        types: [python]
        pass_filenames: true
