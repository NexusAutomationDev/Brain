# .pre-commit-config.yaml
# IMPORTANT: this file is amended by plans 01-04 (grep bans).
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: ["protect", "--staged", "--config", ".gitleaks.toml"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: ["check", "--fix"]
      - id: ruff-format

  # Local hooks reserved for plan 01-04:
  #   - id: ban-asyncpg
  #   - id: ban-sync-postgressaver
  #   - id: ban-raw-thread-id
  #   - id: ban-stdlib-logging
  # See plan 01-04 PLAN.md.
