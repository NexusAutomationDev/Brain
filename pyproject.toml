[project]
name = "brain"
version = "0.1.0"
description = "Centralized LangGraph-based AI orchestration service for conversational bots"
requires-python = "==3.12.*"
readme = "README.md"
dependencies = [
  "fastapi==0.136.1",
  "uvicorn[standard]==0.47.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "httpx==0.28.1",
  "langgraph==1.2.1",
  "langgraph-checkpoint==4.1.0",
  "langgraph-checkpoint-postgres==3.1.0",
  "langchain-core==1.4.0",
  "psycopg[binary,pool]==3.3.4",
  "sqlalchemy==2.0.49",
  "alembic==1.18.4",
  "aio-pika==9.6.2",
  "qdrant-client==1.18.0",
  "structlog==25.5.0",
  "tenacity==9.1.4",
  "langfuse==4.6.1",
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "pytest-cov",
  "testcontainers[postgres,rabbitmq]",
  "ruff==0.15.14",
  "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "T201", "G004", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["G004", "T201"]
"alembic/versions/*.py" = ["G004", "T201", "E501"]
"tests/**/*.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -ra"
filterwarnings = ["error"]
markers = ["integration: requires docker / testcontainers"]

[tool.coverage.run]
source = ["src/brain"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
